site_name: Curso de Terraform
site_description: Documentación y prácticas de Terraform para Azure y AWS con entornos locales
site_author: Guillem Hernandez Sola
site_url: https://agile611.github.io/startusingterraform/

repo_name: agile611/startusingterraform
repo_url: https://github.com/agile611/startusingterraform

docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  logo: https://www.agile611.com/wp-content/uploads/2020/09/Negativo.png
  favicon: https://www.agile611.com/wp-content/uploads/2019/07/cropped-agile611-1-e1563910774746-1-32x32.png

  font:
    text: Nunito
    code: Nunito

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  icon:
    logo: material/chart-timeline-variant
    repo: fontawesome/brands/github

